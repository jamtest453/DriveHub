name: DriveHub and restored Car Search checks
on:
  pull_request:
  push:
    branches: [main]

jobs:
  combined:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: tools/car-search/legacy/requirements.txt
      - name: Install Car Search and pytest dependencies
        run: |
          python -m pip install -r tools/car-search/legacy/requirements.txt
          python -m pip install pytest pytest-asyncio
      - name: Check DriveHub and Car Search JavaScript
        run: npm run check
      - name: Run all original Car Finder Python tests
        working-directory: tools/car-search/legacy
        run: python -m pytest -q --disable-warnings
      - name: End-to-end DriveHub / Python API smoke check
        run: python tools/car-search/tests/live-sidecar-local.py
