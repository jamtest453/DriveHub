<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#14313a" />
  <meta name="description" content="MyGarage keeps your vehicle records, MOT history, reminders, photos and paperwork together." />
  <link rel="manifest" href="manifest.json" />
  <link rel="icon" href="icons/drivehub-192.png" />
  <link rel="apple-touch-icon" href="icons/drivehub-192.png" />
  <link rel="stylesheet" href="css/styles.css?v=14221" />
  <link rel="stylesheet" href="css/design-system.css?v=14221" />
  <link rel="stylesheet" href="../../../shared/public/drivehub-chrome.css?v=14230" />
  <title>DriveHub</title>
  <style>
    .garage-boot{min-height:100dvh;display:grid;place-items:center;padding:24px;background:#f3f5f8;color:#0f172a;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;box-sizing:border-box}.garage-boot-card{text-align:center;max-width:320px}.garage-boot-icon{width:72px;height:72px;border-radius:20px;display:block;margin:0 auto 18px;box-shadow:0 12px 32px rgba(15,23,42,.12)}.garage-boot h1{font-size:22px;margin:0 0 6px;letter-spacing:-.03em}.garage-boot p{margin:0;color:#64748b;font-size:13px;line-height:1.45}.garage-boot-spinner{width:24px;height:24px;margin:20px auto 0;border:3px solid #dfe3ea;border-top-color:#4f46e5;border-radius:50%;animation:garageBootSpin .8s linear infinite}.garage-boot button{margin-top:18px;border:0;border-radius:12px;background:#111827;color:#fff;padding:11px 16px;font:inherit;font-weight:700}@keyframes garageBootSpin{to{transform:rotate(360deg)}}@media(prefers-reduced-motion:reduce){.garage-boot-spinner{animation:none;border-top-color:#dfe3ea}}
  </style>
</head>
<body>
  <div id="app"><main class="garage-boot" aria-live="polite"><div class="garage-boot-card"><img class="garage-boot-icon" src="icons/drivehub-192.png" alt=""><h1>DriveHub</h1><p>Opening DriveHub…</p><div class="garage-boot-spinner" aria-hidden="true"></div></div></main></div>
  <script src="../../../shared/public/drivehub-runtime.js?v=14221"></script>
  <script src="./js/app.bundle.js?v=14221"></script>
  <script src="../../../shared/public/drivehub-chrome.js?v=14230"></script>
</body>
</html>
