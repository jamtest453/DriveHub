name: Test car finder
on:
  push:
    branches: [main, "feature/**"]
  pull_request:
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest pytest-asyncio
      - name: Compile Python
        run: python -m compileall -q server.py src tests
      - name: Validate dashboard JavaScript
        run: node --check public/dashboard.js && node --check src/extractor.js
      - name: Test browser keyword matching
        run: node tests/test_negative_keywords.js && node tests/test_keyword_modes.js
      - name: Run offline tests
        run: python -m pytest -q
